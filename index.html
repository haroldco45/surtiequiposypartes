*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Barlow,"Segoe UI",Roboto,system-ui,sans-serif;background:var(--bg);color:var(--ink);

.wrap{max-width:560px;margin:0 auto;position:relative}

.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;

.top .live{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(141,198,63,.7);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(141,198,63,0)}100%{box-shadow:0 0 0 0 rgba(141,198,63,0)}}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:var(--mute);font:600 12px Barlow,sans-serif;padding:6px 12px;cursor:pointer;letter-spacing:.08em}
.lang button.on{background:var(--green);color:#0b2418}

/* hero */
.hero{position:relative;min-height:560px;display:flex;flex-direction:column;justify-content:flex-end;padding:28px 22px 26px;overflow:hidden}
.hero .ph{position:absolute;inset:-6%;background:url(hero.jpg) 62% center/cover;animation:kb 22s ease-in-out infinite alternate;z-index:0}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.12) translate(-3%,-2%)}}
.hero:after{content:"";position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,rgba(8,25,15,.15) 0%,rgba(8,25,15,.35) 40%,rgba(8,25,15,.96) 88%,var(--bg) 100%)}
.hero>*{position:relative;z-index:2}
.logo{width:min(88%,380px);display:block;filter:drop-shadow(0 6px 20px rgba(0,0,0,.45));animation:rise .9s .1s both}
.slogan{margin-top:22px;font:800 clamp(30px,8.6vw,44px)/.95 "Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,sans-serif;letter-spacing:.02em;text-transform:uppercase;animation:rise .9s .25s both}
.slogan span{color:var(--green)}
.bar{height:5px;width:84px;background:var(--green);border-radius:3px;margin:16px 0 14px;transform-origin:left;animation:grow 1.1s .5s both}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.who{font:600 22px "Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,sans-serif;letter-spacing:.04em;animation:rise .9s .4s both}
.who small{display:block;font:500 15px Barlow,sans-serif;color:var(--mute);letter-spacing:0;margin-top:2px}

/* actions */
.actions{padding:6px 16px 4px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;min-height:74px;padding:14px 16px;border-radius:var(--r);

.btn b{font:700 19px "Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,sans-serif;letter-spacing:.04em;text-transform:uppercase}
.btn span{font-size:13px;color:var(--mute);margin-top:2px;word-break:break-word}
.btn.main{grid-column:1/-1;min-height:88px;background:linear-gradient(110deg,var(--green) 0%,#a6d957 50%,var(--green) 100%);background-size:220% 100%;

.btn.main b{font-size:25px}
.btn.main span{color:#1d3d14;font-weight:600;font-size:15px}
@keyframes shine{from{background-position:100% 0}to{background-position:-120% 0}}
.btn.main:after{content:"";position:absolute;right:18px;top:50%;width:14px;height:14px;border-top:3px solid #0b2418;border-right:3px solid #0b2418;transform:translateY(-50%) rotate(45deg)}

section{padding:34px 18px 0}
.kicker{font:700 13px Barlow,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--green)}
h2{font:800 34px/.98 "Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,sans-serif;text-transform:uppercase;margin-top:6px}

.line{display:grid;grid-template-columns:64px 1fr;align-items:center;gap:6px;padding:14px 16px;border-radius:var(--r);

.line p{color:var(--mute);font-size:14px;margin-top:2px}

.band .q span{background:var(--green);color:#0b2418;padding:0 8px;box-decoration-break:clone;-webkit-box-decoration-break:clone}

form{margin-top:16px;display:grid;gap:10px}
label{font-size:13px;color:var(--mute);letter-spacing:.04em;display:grid;gap:6px}
input,select,textarea{font:500 16px Barlow,sans-serif;color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;width:100%}

textarea{min-height:84px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.send{margin-top:4px;border:0;border-radius:var(--r);padding:17px;font:700 21px "Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,sans-serif;letter-spacing:.05em;text-transform:uppercase;background:var(--green);color:#0b2418;cursor:pointer}
.send:active{transform:scale(.98)}

/* brands */
.brands{margin-top:16px;background:#fff;border-radius:var(--r);overflow:hidden;padding:14px 0}
.track{display:flex;width:max-content;animation:mq 26s linear infinite}
.track img{height:46px;width:auto;margin-right:40px;display:block}
@keyframes mq{to{transform:translateX(-50%)}}

/* physical card flip */
.flip{margin-top:16px;perspective:1200px;cursor:pointer}
.flip .in{position:relative;aspect-ratio:272/159;transition:transform .9s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d}
.flip.back .in{transform:rotateY(180deg)}
.flip img{position:absolute;inset:0;width:100%;height:100%;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 18px 40px rgba(0,0,0,.5)}
.flip img.b{transform:rotateY(180deg)}
.hint{font-size:13px;color:var(--mute);text-align:center;margin-top:10px}

/* qr + contact */
.qr{margin-top:16px;display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.qr img{width:132px;height:132px;border-radius:10px;background:#fff;padding:6px}
.qr b{font:700 20px "Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,sans-serif;text-transform:uppercase}
.qr p{color:var(--mute);font-size:14px;margin-top:4px;line-height:1.4}
.data{margin-top:12px;border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.data div{display:flex;justify-content:space-between;gap:12px;padding:13px 16px;border-top:1px solid var(--line);font-size:15px}
.data div:first-child{border-top:0}
.data dt{color:var(--mute)}
.data dd{text-align:right;font-weight:600}
.copy{background:none;border:1px solid var(--line);color:var(--green);border-radius:999px;padding:3px 10px;font:600 12px Barlow,sans-serif;cursor:pointer;margin-left:8px}

footer{padding:40px 18px 50px;text-align:center;color:var(--mute);font-size:13px;line-height:1.6}
footer a{color:var(--green)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;background:var(--green);color:#0b2418;
  font-weight:600;padding:12px 18px;border-radius:999px;transition:.3s;z-index:50;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(8,25,15,0),rgba(8,25,15,.95) 40%);transform:translateY(110%);transition:.35s}
.sticky.on{transform:none}
.sticky a{display:block;max-width:530px;margin:0 auto;text-align:center;background:var(--green);color:#0b2418;border-radius:999px;padding:14px;font:700 19px "Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,sans-serif;letter-spacing:.06em;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.line{opacity:1;transform:none}}
@media (min-width:700px){body{background:radial-gradient(ellipse at top,#123a24,var(--bg) 60%)}.wrap{border-left:1px solid var(--line);border-right:1px solid var(--line);background:var(--bg)}}

  if(!("IntersectionObserver" in window)){document.querySelectorAll(".line").forEach(l=>l.classList.add("in"));return}
  io&&io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const i=[...e.target.parentNode.children].indexOf(e.target);setTimeout(()=>e.target.classList.add("in"),i*110);io.unobserve(e.target)}}),{threshold:.2});
  document.querySelectorAll(".line").forEach(l=>io.observe(l));
}

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),2600)}
async function copy(txt,msg){try{await navigator.clipboard.writeText(txt);toast(msg||T[L].copied)}catch(e){toast(txt)}}

$("#f").onsubmit=e=>{
  e.preventDefault();const t=T[L],v=id=>$(id).value.trim();
  const m=[t.msgHi,"",v("#fn")&&`${t.msgName}: ${v("#fn")}`,v("#fc")&&`${t.msgCity}: ${v("#fc")}`,`${t.msgNeed}: ${$("#fl").value}`,
    (v("#fb")||v("#fm"))&&`${t.msgBrand}: ${[v("#fb"),v("#fm")].filter(Boolean).join(" ")}`,v("#fr")&&`${t.msgRef}: ${v("#fr")}`].filter(Boolean).join("\n");
  location.href=`https://wa.me/${PHONE}?text=${encodeURIComponent(m)}`;
};

$("#vcf").onclick=()=>{
  const v=["BEGIN:VCARD","VERSION:3.0","N:;Surtiequipos y Partes;;;","FN:Surtiequipos y Partes - Ventas","ORG:Surtiequipos y Partes de Colombia S.A.S.","TITLE:Ventas · Almacén",
  "TEL;TYPE=CELL,VOICE:+573126766469","EMAIL;TYPE=WORK:ventas@surtiequiposypartes.com","URL:https://surtiequiposypartes.com",
  "ADR;TYPE=WORK:;;Calle 30 #17-17 La Ye;Caucasia;Antioquia;;Colombia","NOTE:Repuestos · Lubricantes · Filtros · Servicio técnico · Accesorios","END:VCARD"].join("\r\n");
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([v],{type:"text/vcard"}));a.download="Surtiequipos.vcf";document.body.appendChild(a);a.click();a.remove();toast(T[L].vcfOk)}catch(e){toast(T[L].vcfNo)}
};
$("#share").onclick=async()=>{
  const url=location.href.split("#")[0],d={title:"Surtiequipos y Partes",text:L==="es"?"Repuestos y servicio para maquinaria pesada en Caucasia":"Heavy machinery parts and service in Caucasia",url};
  try{if(navigator.share){await navigator.share(d);return}}catch(e){if(e.name==="AbortError")return}
  copy(url,T[L].linkCopied);
};
document.querySelectorAll(".copy").forEach(b=>b.onclick=()=>copy(b.dataset.c));
$("#flip").onclick=()=>$("#flip").classList.toggle("back");
setInterval(()=>{if(!$("#flip").matches(":hover"))$("#flip").classList.toggle("back")},5000);

const par=$("#par"),band=par.parentNode,st=$("#sticky");
addEventListener("scroll",()=>{
  const r=band.getBoundingClientRect(),p=(r.top+r.height/2-innerHeight/2)/innerHeight;
  par.style.transform=`scale(1.15) translateY(${p*-40}px)`;
  st.classList.toggle("on",scrollY>520&&(innerHeight+scrollY)<document.body.scrollHeight-120);
},{passive:true});

render();
if("serviceWorker" in navigator&&location.protocol==="https:"&&!/claude|usercontent/.test(location.host)){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
